# Include this server block from nginx's http context (e.g. conf.d/).
server {
    listen 80;
    server_name hospital.example.com;

    root /var/www/mu-hospital;
    index index.html;

    # Only Vite's content-hashed assets can be cached indefinitely.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # This file is a GitHub Pages redirect hardcoded to /mu-hospital/.
    location = /404.html {
        return 404;
    }

    # Navigation uses #/ routes, so unknown physical paths should return 404.
    # Revalidate HTML and public files (images/fonts have no content hashes).
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
